[theme]
base = "dark"
primaryColor = "#8b7cf6"
backgroundColor = "#0d0f14"
secondaryBackgroundColor = "#1b1e29"
textColor = "#f2f2f0"
borderColor = "#2a2e3b"
linkColor = "#a99ff9"
baseRadius = "0.7rem"
